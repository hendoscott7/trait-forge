.abs(Math.floor(e))%2147483646+1,()=>(e=16807*e%2147483647)/2147483647}const t=["belief","habit","flaw"],a={belief:["Swore an oath to a god who has never once answered.","Death owes them a favour, and they intend to collect.","Every scar is a lesson. They have learned a great deal.","Mercy is a debt the weak expect others to pay.","Their bloodline is cursed, and they're proud of it.","The dead are always listening, so they speak carefully.","Gold rots. Grudges keep.","Every crown was stolen from someone.","Fate is a chain, and they mean to snap it.","Anything worth having was taken in the dark.","The gods are hungry, and someone has to feed them.","Fear is the only honest feeling.","A promise sealed in blood can't be broken. They've made several.","There's no problem fire can't improve.","Someday they'll be the monster in someone else's story.","The world ends in winter, and they've already seen it."],habit:["Names every blade after someone they've buried.","Sleeps with a knife under the pillow and another in the boot.","Keeps a tooth from every foe they've beaten.","Toasts the dead at every meal, by name, at length.","Hums funeral hymns while sharpening steel.","Burns letters without opening them.","Visits the graveyard in every town, just to read the names.","Reads omens in spilled wine and won't explain them.","Talks to their shadow when they think no one's looking.","Collects bounty posters, including their own.","Never sits with their back to a door.","Writes every name in a black ledger nobody may read.","Prays before every kill. Nobody knows to which god.","Laughs during thunderstorms.","Wears a stranger's ring and won't say whose.","Washes their hands long after the blood is gone."],flaw:["Can't keep a secret past the second drink.","Will start a fight with anyone who mocks their dead.","Never backs down from a dare, even a fatal one.","Holds grudges for decades. Keeps a list. The list is long.","Trusts anyone who bleeds beside them. It has gone badly.","Has to touch the cursed thing.","Owes money to something that isn't human.","Laughs at funerals, including one that was nearly their own.","Falls in love fast, and always with the wrong side.","Lies even when the truth would hurt less.","Hears whispers in empty rooms, and answers them.","Can't walk away from a locked door or a lost cause.","Competitive about everything, even suffering.","Goes very quiet when anyone mentions home.","Sleeps through every watch, wakes for every ambush.",'Every plan is "kill it before it breeds."']},o=[{belief:["Rage is a gift from their ancestors, and they never waste it.","Every door is a wall that hasn't met them yet."],habit:["Paints their face with ash before a fight.","Howls at the moon. It has never howled back."],flaw:["Can't hear the plan over the blood in their ears.",'Takes "don\'t open that" as an invitation.']},{belief:["Every massacre deserves a ballad.","They will be remembered, one way or another."],habit:["Writes elegies for people who are still alive.","Sings to the corpses after a battle."],flaw:["Will lie to make a tragedy more beautiful.","Owes their voice to a demon, on loan."]},{belief:["Their god speaks to them, mostly about vengeance.","Even the damned deserve last rites."],habit:["Anoints their weapon before every fight.","Prays over enemies, then finishes them."],flaw:["Judges the party's sins, out loud.","Can't lie without confessing immediately."]},{belief:["Cities are wounds on the land.","Every rot feeds something new."],habit:["Buries a seed wherever someone dies.","Speaks to crows and keeps their secrets."],flaw:["Won't eat anything they've met.","Would let a village burn to save a forest."]},{belief:["Every problem is an enemy you haven't killed yet.","Steel never lies."],habit:["Cleans their blade before they eat.","Counts the exits in every room."],flaw:["Can't sit with their back to a door.","Settles every argument with their fists."]},{belief:["Locks are invitations.","Everyone has a price. Theirs is high."],habit:["Pockets keepsakes from the dead.","Checks for traps everywhere, including the privy."],flaw:["Steals from the party out of habit.","Can't resist a con, even on friends."]},{belief:["Their patron is fine. Totally fine.","Every deal has a loophole. They haven't found theirs."],habit:["Argues with a voice nobody else can hear.","Signs things in red ink. It isn't ink."],flaw:["Pays off their soul in instalments.","Goes very quiet when asked about their patron."]},{belief:["Forbidden books are just books that were right.","Death is a puzzle they haven't solved yet."],habit:["Takes careful notes on how people die.","Keeps a familiar that isn't entirely alive."],flaw:["Will risk anything for a forbidden page.","Panics without a plan."]},{belief:["Their oath covers this. Probably.","Evil has a smell, and they can smell it."],habit:["Gives a sermon before every slaughter.","Offers mercy to enemies who are still swinging."],flaw:["Smites first, asks later.","Self-righteous after one drink."]}],n={belief:["Every oath can be broken if the price is right.","The sea remembers every drowned soul.","Silence is the loudest threat.","No one should die in their bed.","A sword should be named before it's bloodied.","Blood debts pass to the children.","The moon is a watching eye.","Old gods sleep, and must not be woken.","Pain is a teacher that never takes a day off.","Strangers are just enemies who haven't introduced themselves.","Every tavern hides a murderer.","The dead deserve better company than the living.","Witches are owed respect, and distance.","Crows carry messages for those who listen.","Trust is a coin you only spend once.","It's better to be feared than forgotten."],habit:["Cracks their knuckles before every lie.","Keeps a list of everyone who has ever insulted them.","Spits before crossing any threshold.","Carves their initials into every bed they sleep in.","Never turns their back on a fire.","Collects the last words of the dying.","Checks every cup for poison, even water.","Whittles small grim figures at night.","Never says the names of the dead aloud.","Wraps their knuckles in old bandages that are never washed.","Buys a drink for every grave they pass.","Rolls a dead friend's dice for luck.","Paces the same number of steps before sleep.","Hums war marches when bored.","Sharpens blades that are already sharp.","Always sits nearest the exit."],flaw:["Can't resist a bet against fate.","Treats every slight as a blood feud.","Steals small things when anxious.","Panics in the dark, and hides it badly.","Drinks until the voices go quiet.","Never forgives, not even the dead.","Trusts omens over friends.","Picks fights with anyone who seems kind.","Makes promises they can't keep, then keeps them anyway, badly.","Can't stand silence, so fills it with threats.","Talks in their sleep. Says names.","Would betray anyone to protect one person.","Hates being thanked.","Turns cruel when frightened.","Keeps secrets even from themselves.","Never knows when to stop."]};t.forEach((e=>{a[e]=a[e].concat(n[e])}));const r={belief:["A dying god told them exactly when they will die. It isn't soon.","They are the last of an order that once held back the dark.","Knows the true name of a demon, and the demon knows it.","Swore to outlive every king in the realm. Three down.","Has seen the end of the world and decided to postpone it.","Something ancient watches over them. It is not kind to anyone else."],habit:["Hums a song no one has heard in a thousand years.","Sleeps beside a weapon that whispers back.","Marks every victory with a rune that burns for a day.","Writes to Death every new moon. Death writes back.","Walks into every battle singing, and has never lost one.","Sharpens a blade that has never been drawn, waiting for the right throat."],flaw:["Cannot die until they finish a task they've forgotten.","Every lie they tell comes true by morning.","Whoever wrongs them withers within the year. Friends are nervous.","Can't refuse a challenge
