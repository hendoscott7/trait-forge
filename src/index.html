<body>
<style>
/* Layout: a sheet of grainy printed paper with a hand-cut wobbly edge, on black. Fat black title, three traits each led by a black ink tile with a white emblem, and the bottom of the sheet left clear for the ink-black d20s to land on. Single deliberate look: paper, black ink, one red. */
:root{
  --night:#0a0a09; --paper:#e8e4dc; --ink:#121212; --soft:#5d5952; --red:#6e0905; --mute:#9a958c; --slip:#f7f3ea; --slipShade:rgba(60,45,25,.18); --ring:rgba(18,18,18,.16);
  --display:"Bowlby One", "Arial Black", Impact, sans-serif;
  --sans:"IM Fell English", Georgia, "Times New Roman", serif;
  --floor:150px; --edge:8px; --foot:calc(var(--edge) + 14px + env(safe-area-inset-bottom, 0px)); --head:calc(var(--edge) + env(safe-area-inset-top, 0px));
  color-scheme:light;
}
:root[data-mode="dark"]{ --night:#0a0a09; --paper:#252321; --ink:#e9e1d1; --soft:#8b847a; --red:#8c0c06; --mute:#5f5a53; --slip:#36322c; --slipShade:rgba(0,0,0,.55); --ring:rgba(233,225,209,.17); color-scheme:dark }
html{background:var(--paper)}
html,body{height:100%; height:100dvh; margin:0; overflow:hidden; overscroll-behavior:none}
body{box-sizing:border-box}
body{
  background:transparent; color:var(--ink); font-family:var(--sans); touch-action:manipulation;
  padding-left:max(calc(var(--edge) + 10px), env(safe-area-inset-left, 0px));
  padding-right:max(calc(var(--edge) + 10px), env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
}
.sheet{position:fixed; inset:-30vh 0; z-index:-1; pointer-events:none; background:var(--paper)}
/* the paper grain fades out at the top and bottom, so the page melts into the browser bars */
.sheet{-webkit-mask-image:linear-gradient(to bottom, transparent 30vh, #000 calc(30vh + 90px), #000 calc(130vh - 90px), transparent 130vh); mask-image:linear-gradient(to bottom, transparent 30vh, #000 calc(30vh + 90px), #000 calc(130vh - 90px), transparent 130vh)}
#hell{position:fixed; left:0; right:0; bottom:0; width:100%; height:55vh; z-index:-1; pointer-events:none; opacity:0; transition:opacity 1.2s ease}
#hell.on{opacity:1}

/* ---------- alignment: a dot chart in a sheet from the bottom ---------- */
(function alignDrawer(){
  const btn = document.getElementById("alignBtn"), mini = btn.querySelector(".mini"), drawer = document.getElementById("drawer"), scrim = document.getElementById("scrim");
  const pad = document.getElementById("pad"), aname = document.getElementById("aname");
  const LAW = { 1: "Lawful", 0: "Neutral", "-1": "Chaotic" }, MOR = { 1: "Good", 0: "Neutral", "-1": "Evil" };
  const nameOf = a => !a ? "Any" : (a.law === 0 && a.moral === 0 ? "True Neutral" : LAW[a.law] + " " + MOR[a.moral]);
  const dots = [];
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
    const d = document.createElement("i"); d.style.left = (16.6 + c * 33.4) + "%"; d.style.top = (16.6 + r * 33.4) + "%";
    d.dataset.law = String(1 - c); d.dataset.moral = String(1 - r); pad.appendChild(d); dots.push(d);
  }

    aname.textContent = name; aname.classList.toggle("Any", !ALIGN); pad.setAttribute("aria-valuetext", name);
    btn.setAttribute("aria-label", "Alignment: " + name); btn.classList.toggle("set", !!ALIGN);
    let g = '<rect x="4" y="4" width="16" height="16" rx="2.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.33 4.5v15M14.67 4.5v15M4.5 9.33h15M4.5 14.67h15" stroke="currentColor" stroke-width="1.1" opacity=".4"/>';
    if (ALIGN) { const c = 1 - ALIGN.law, r = 1 - ALIGN.moral; g += '<rect x="' + (4.6 + c * 5.33) + '" y="' + (4.6 + r * 5.33) + '" width="4.13" height="4.13" rx=".8" fill="currentColor"/>'; }
    mini.innerHTML = g;
    try { localStorage.setItem("tf-align", JSON.stringify(ALIGN)); } catch (e) {}
    if (Dice) Dice.paint();
    hellfire(!!ALIGN && ALIGN.law === -1 && ALIGN.moral === -1);
    grace(!!ALIGN && ALIGN.law === 1 && ALIGN.moral === 1);
  }
  let open = false, closeT = null;
  function openDrawer(){
    if (open) return; open = true; scrim.hidden = false; drawer.hidden = false; drawer.style.transform = "";
    if (!reduce) { drawer.animate([{ transform: "translateY(calc(100% + 60px))" }, { transform: "none" }], { duration: 320, easing: "cubic-bezier(.2,.9,.3,1)" }); scrim.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220 }); }
    pad.focus({ preventScroll: true });
  }
  function closeDrawer(){

    const done = () => { drawer.hidden = true; scrim.hidden = true; drawer.style.transform = ""; };
    if (reduce) return done();
    drawer.animate([{ transform: drawer.style.transform || "none" }, { transform: "translateY(calc(100% + 60px))" }], { duration: 240, easing: "cubic-bezier(.4,0,.8,.4)" }).onfinish = done;
    scrim.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 240 });
    btn.focus({ preventScroll: true });
  }
  const closeSoon = () => { clearTimeout(closeT); closeT = setTimeout(closeDrawer, 420); };
  // tap or drag across the chart; let go to set it. Tap the lit dot again to clear.
  function cellAt(e){
    const r = pad.getBoundingClientRect();
    const c = Math.max(0, Math.min(2, Math.floor((e.clientX - r.left) / r.width * 3))), w = Math.max(0, Math.min(2, Math.floor((e.clientY - r.top) / r.height * 3)));
